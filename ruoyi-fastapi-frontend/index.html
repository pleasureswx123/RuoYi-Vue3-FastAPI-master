<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/shot-grid-mark.svg">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* 应用挂载前尚不能使用 Element Plus，启动占位保持静态且不依赖脚本。 */
    #boot-screen {
      box-sizing: border-box;
      display: grid;
      min-height: 100%;
      padding: 32px 24px;
      color: #f0f3f7;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(234, 145, 36, 0.08), transparent 55%),
        linear-gradient(138deg, #1c222c 0%, #0e1219 55%, #080a0e 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      text-align: center;
      place-items: center;
    }

    #boot-screen .boot-content {
      width: min(100%, 320px);
    }

    #boot-screen .boot-mark {
      display: grid;
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      background: #f4aa4b;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(191, 101, 0, 0.16);
      place-items: center;
    }

    #boot-screen .boot-mark img {
      width: 32px;
      height: 32px;
    }

    #boot-screen .boot-name {
      margin: 0;
      font-size: 23px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
    }

    #boot-screen .boot-description {
      margin: 10px 0 36px;
      color: #9ba7b8;
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    #boot-screen .boot-track {
      height: 2px;
      overflow: hidden;
      background: #29313d;
      border-radius: 2px;
    }

    #boot-screen .boot-track::after {
      display: block;
      width: 40%;
      height: 100%;
      content: '';
      background: #f5ad55;
      border-radius: inherit;
      animation: boot-loading 1.8s ease-in-out infinite;
    }

    #boot-screen .boot-status {
      margin: 16px 0 0;
      color: #9ba7b8;
      font-size: 12px;
      line-height: 1.6;
    }

    @keyframes boot-loading {
      from { transform: translateX(-100%); }
      to { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-screen .boot-track::after {
        width: 100%;
        animation: none;
        opacity: 0.65;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="boot-screen" role="status" aria-live="polite" aria-label="正在加载 SHOT GRID 管理平台">
      <div class="boot-content">
        <div class="boot-mark" aria-hidden="true">
          <img src="/shot-grid-mark.svg" alt="" width="32" height="32">
        </div>
        <p class="boot-name">SHOT GRID</p>
        <p class="boot-description">影视制作平台 · 管理控制台</p>
        <div class="boot-track" aria-hidden="true"></div>
        <p class="boot-status">正在加载，请稍候</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
