name: ruoyi-fastapi-local-dev

services:
  # 后端固定使用 Python 3.11.15，并在镜像内提供 FFmpeg。
  # Linux 容器不直接执行 Windows UNC/NAS I/O，因此本地容器只启用媒体派生 Worker。
  backend:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.dev
    image: ruoyi-fastapi-backend-dev:python3.11-ffmpeg
    init: true
    restart: unless-stopped
    working_dir: /app
    command:
      - python
      - -m
      - uvicorn
      - server:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "9099"
      - --reload
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 9099
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SHOT_GRID_STORAGE_WORKER_ENABLED: "false"
      SHOT_GRID_VERSION_WORKER_ENABLED: "false"
      SHOT_GRID_MEDIA_WORKER_ENABLED: "true"
      SHOT_GRID_MEDIA_WORKER_FFMPEG_PATH: /usr/bin/ffmpeg
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - ./ruoyi-fastapi-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/openapi.json', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 2m

  # 本地开发数据库；仅绑定回环地址，避免暴露到局域网。
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ruoyi-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ruoyi-dev-postgres-data:/var/lib/postgresql/data
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruoyi-fastapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 本地开发缓存；数据使用命名卷持久化。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ruoyi-dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ruoyi-dev-postgres-data:
  ruoyi-dev-redis-data:
