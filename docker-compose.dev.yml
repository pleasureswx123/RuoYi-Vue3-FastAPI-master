name: ruoyi-fastapi-local-dev

services:
  # 本地开发数据库；仅绑定回环地址，避免暴露到局域网。
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ruoyi-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ruoyi-dev-postgres-data:/var/lib/postgresql/data
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruoyi-fastapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 本地开发缓存；数据使用命名卷持久化。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ruoyi-dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ruoyi-dev-postgres-data:
  ruoyi-dev-redis-data:
