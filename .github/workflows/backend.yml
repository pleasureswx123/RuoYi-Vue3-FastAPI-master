name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Typer otherwise forces ANSI help output when GITHUB_ACTIONS is set.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
      # 本任务不提供真实集成库；跳过项单独报告，不访问外部数据库。
      SHOT_GRID_RUN_PG_TESTS: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: ruoyi-fastapi-backend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ruoyi-fastapi-backend/requirements-pg.txt
            ruoyi-fastapi-backend/requirements-pg.lock.txt
            ruoyi-fastapi-backend/plugins/ai/plugin.yaml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pg.txt pytest pytest-asyncio aiosqlite

      - name: Install AI plugin dependencies
        run: |
          pip install \
            agno==2.8.6 \
            anthropic==0.120.2 \
            cerebras-cloud-sdk==1.91.0 \
            cohere==7.0.8 \
            google-genai==2.16.0 \
            groq==1.6.0 \
            litellm==1.94.0 \
            llama-api-client==0.6.0 \
            mistralai==2.8.0 \
            ollama==0.6.2 \
            openai==2.52.0 \
            portkey-ai==2.3.4

      - name: Run backend tests
        run: pytest -q --junitxml=test-results/backend.xml

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-failure-${{ matrix.python-version }}
          path: ruoyi-fastapi-backend/test-results/
          retention-days: 7

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装独立审计工具
        run: python -m pip install pip-audit
      - name: 审计实际生产依赖锁定版本
        working-directory: ruoyi-fastapi-backend
        run: |
          python -c "from pathlib import Path; p=Path('requirements-pg.lock.txt'); Path('audit-requirements.txt').write_text('\n'.join(line for line in p.read_text().splitlines() if line.strip() != '.'), encoding='utf-8')"
          pip-audit --no-deps --disable-pip -r audit-requirements.txt
