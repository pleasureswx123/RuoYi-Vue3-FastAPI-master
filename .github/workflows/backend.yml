name: Backend Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-fastapi-backend
    steps:
      - uses: actions/checkout@v5
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ruoyi-fastapi-backend/requirements-test-pg.txt
      - name: 安装测试及静态检查依赖
        run: python -m pip install -r requirements-test-pg.txt
      - name: 记录 Python 版本
        run: python --version
      - name: Ruff 检查
        run: |
          python -m ruff check .
          python -m ruff format . --check

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ruoyi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ruoyi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ruoyi-fastapi-backend
    steps:
      - uses: actions/checkout@v5
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ruoyi-fastapi-backend/requirements-pg.txt
            ruoyi-fastapi-backend/requirements-test-pg.txt
            ruoyi-fastapi-backend/plugins/ai/plugin.yaml
      - name: 安装 PostgreSQL 测试依赖
        run: python -m pip install -r requirements-test-pg.txt
      - name: 安装 AI 插件测试依赖
        run: |
          python -m pip install \
            agno==2.8.6 \
            anthropic==0.120.2 \
            cerebras-cloud-sdk==1.91.0 \
            cohere==7.0.8 \
            google-genai==2.16.0 \
            groq==1.6.0 \
            litellm==1.94.0 \
            llama-api-client==0.6.0 \
            mistralai==2.8.0 \
            ollama==0.6.2 \
            openai==2.52.0 \
            portkey-ai==2.3.4
      - name: 记录 Python 与 PostgreSQL 版本
        env:
          PGPASSWORD: postgres
        run: |
          python --version
          psql --host localhost --username postgres --dbname ruoyi_test --tuples-only --command 'SHOW server_version;'
      - name: Shot Grid 后端测试
        run: python -m pytest -q tests/module_shot_grid
      - name: 后端完整测试
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: python -m pytest -q
