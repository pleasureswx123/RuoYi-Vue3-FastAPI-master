name: Shot Grid Frontend

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

env:
  NODE_VERSION: 20.20.2
  NPM_VERSION: 11.4.2

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shot-grid-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shot-grid-frontend/package-lock.json
      - name: 安装并记录工具版本
        run: |
          npm install --global npm@"$NPM_VERSION"
          node --version
          npm --version
      - name: 按锁文件安装依赖
        run: env -u npm_config_http_proxy npm ci
      - name: 前端 lint
        run: env -u npm_config_http_proxy npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shot-grid-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shot-grid-frontend/package-lock.json
      - name: 安装并记录工具版本
        run: |
          npm install --global npm@"$NPM_VERSION"
          node --version
          npm --version
      - name: 按锁文件安装依赖
        run: env -u npm_config_http_proxy npm ci
      - name: 前端测试
        run: env -u npm_config_http_proxy npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shot-grid-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shot-grid-frontend/package-lock.json
      - name: 安装并记录工具版本
        run: |
          npm install --global npm@"$NPM_VERSION"
          node --version
          npm --version
      - name: 按锁文件安装依赖
        run: env -u npm_config_http_proxy npm ci
      - name: 前端生产构建
        run: env -u npm_config_http_proxy npm run build:prod
