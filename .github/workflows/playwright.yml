name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pg-test:
    # Shot Grid 当前只支持 PostgreSQL；跨 Python 版本覆盖放在 backend.yml。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: shotgrid-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_BACKEND_IMAGE: shotgrid-ci-backend:${{ github.sha }}
      CI_ADMIN_IMAGE: shotgrid-ci-admin:${{ github.sha }}
      TEST_FRONTEND_URL: http://localhost:18080
      TEST_BACKEND_URL: http://localhost:19099
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ruoyi-fastapi-test/requirements.txt
      - name: 生成仅用于本轮隔离测试的密钥
        shell: bash
        run: |
          db_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "CI_DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "CI_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: 构建后端并复用层缓存
        uses: docker/build-push-action@v6
        with:
          context: ./ruoyi-fastapi-backend
          file: ./ruoyi-fastapi-backend/Dockerfile.prod
          load: true
          tags: ${{ env.CI_BACKEND_IMAGE }}
          build-args: |
            PIP_INSTALL_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=playwright-backend
          cache-to: type=gha,mode=max,scope=playwright-backend
      - name: 构建管理端并复用层缓存
        uses: docker/build-push-action@v6
        with:
          context: ./ruoyi-fastapi-frontend
          file: ./ruoyi-fastapi-frontend/Dockerfile.prod
          load: true
          tags: ${{ env.CI_ADMIN_IMAGE }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=playwright-admin
          cache-to: type=gha,mode=max,scope=playwright-admin
      - name: 启动独立环境并等待真实健康检查
        run: docker compose -f ruoyi-fastapi-test/docker-compose.test.pg.yml up -d --no-build --wait --wait-timeout 240
      - name: 安装浏览器测试依赖
        run: |
          python -m pip install -r ruoyi-fastapi-test/requirements.txt
          python -m playwright install --with-deps chromium
      - name: 执行完整管理端浏览器测试
        working-directory: ruoyi-fastapi-test
        run: python -m pytest -v --junitxml=test-results/results.xml
      - name: 保存失败诊断
        if: failure()
        run: |
          mkdir -p ci-artifacts
          docker compose -f ruoyi-fastapi-test/docker-compose.test.pg.yml ps -a > ci-artifacts/services.txt
          docker compose -f ruoyi-fastapi-test/docker-compose.test.pg.yml logs --no-color --tail=300 > ci-artifacts/services.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            ruoyi-fastapi-test/test-results/
          retention-days: 7
      - name: 仅清理本轮隔离环境
        if: always()
        run: docker compose -f ruoyi-fastapi-test/docker-compose.test.pg.yml down -v --remove-orphans
