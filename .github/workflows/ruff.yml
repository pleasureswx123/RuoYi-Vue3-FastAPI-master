name: Ruff Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.1

      - name: Run linting
        run: |
          ruff check ruoyi-fastapi-backend
          ruff check ruoyi-fastapi-test

      - name: Run format check
        run: |
          ruff format ruoyi-fastapi-backend --check
          ruff format ruoyi-fastapi-test --check
