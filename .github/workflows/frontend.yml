name: Frontend Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shot-grid:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shot-grid-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shot-grid-frontend/package-lock.json
      - run: npm ci
      - name: 拒绝生产依赖高危与严重漏洞
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run lint
      - name: 在固定内存预算内执行完整组件回归
        run: npm run test -- --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build:prod

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-fastapi-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ruoyi-fastapi-frontend/package-lock.json
      - name: 按管理端锁文件安装依赖
        run: npm ci --no-audit --no-fund
      - name: 拒绝生产依赖高危与严重漏洞
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run test:plugin
      - run: npm run test:dependencies
      - run: npm run build:prod

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 生成一次性校验环境
        run: bash deploy/init-env.sh 192.168.10.122
      - name: 校验生产 Compose
        env:
          RUOYI_ENV_FILE: ./deploy/.env.production
          APP_RELEASE_ID: ci
        run: docker compose --project-name ruoyi-shot-grid-prod --env-file deploy/.env.production -f docker-compose.prod.yml config --quiet
      - name: 校验部署脚本语法
        run: bash -n deploy/init-env.sh deploy/deploy.sh deploy/status.sh deploy/rollback.sh ruoyi-fastapi-backend/docker/entrypoint.prod.sh
      - name: 校验回滚兼容预检控制流
        run: bash deploy/tests/test-rollback-gate.sh
      - name: 校验停写迁移与失败关闭
        run: bash deploy/tests/test-deploy-gate.sh
      - name: 校验快捷部署镜像缓存与隔离模式
        shell: pwsh
        run: ./deploy/tests/test-image-cache.ps1
