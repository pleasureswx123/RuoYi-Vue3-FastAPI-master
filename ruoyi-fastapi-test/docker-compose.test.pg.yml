# 专用 CI 环境：独立项目名、网络和临时数据，不连接生产数据库或 NAS。
services:
  ruoyi-frontend:
    image: ${CI_ADMIN_IMAGE:-shotgrid-ci-admin:local}
    build:
      context: ../ruoyi-fastapi-frontend
      dockerfile: Dockerfile.prod
    environment:
      BACKEND_UPSTREAM: http://ruoyi-backend-pg:9099
    ports:
      - "127.0.0.1:${CI_FRONTEND_PORT:-18080}:80"
    depends_on:
      ruoyi-backend-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  ruoyi-backend-pg:
    image: ${CI_BACKEND_IMAGE:-shotgrid-ci-backend:local}
    build:
      context: ../ruoyi-fastapi-backend
      dockerfile: Dockerfile.prod
    environment:
      APP_ENV: production
      APP_RELOAD: "false"
      APP_WORKERS: "1"
      APP_ROOT_PATH: /prod-api
      APP_DISABLE_SWAGGER: "true"
      APP_DISABLE_REDOC: "true"
      APP_IP_LOCATION_QUERY: "false"
      APP_DEFAULT_ENABLED_PLUGINS: ""
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${CI_FRONTEND_PORT:-18080}
      DB_TYPE: postgresql
      DB_HOST: ruoyi-pg
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${CI_DB_PASSWORD:?请设置临时测试数据库密码}
      DB_DATABASE: shotgrid_ci
      DB_ECHO: "false"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DATABASE: "0"
      JWT_SECRET_KEY: ${CI_JWT_SECRET:?请设置临时测试JWT密钥}
      # 沿用隔离浏览器测试的明文协议，不用于生产或传输加密验收。
      TRANSPORT_CRYPTO_ENABLED: "false"
      TRANSPORT_CRYPTO_MODE: "off"
      LOG_FILE_ENABLED: "false"
      SHOT_GRID_STORAGE_WORKER_ENABLED: "false"
      SHOT_GRID_VERSION_WORKER_ENABLED: "false"
      SHOT_GRID_MEDIA_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:${CI_BACKEND_PORT:-19099}:9099"
    depends_on:
      ruoyi-pg:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/captchaImage', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 15s

  ruoyi-pg:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: ${CI_DB_PASSWORD:?请设置临时测试数据库密码}
      POSTGRES_DB: shotgrid_ci
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - ../ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./disable_captcha.sql:/docker-entrypoint-initdb.d/02-test-config.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shotgrid_ci"]
      interval: 5s
      timeout: 5s
      retries: 30

  ruoyi-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
