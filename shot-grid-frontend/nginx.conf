server {
    listen 80;
    server_name _;

    location /shot-grid/ {
        alias /usr/share/nginx/html/shot-grid/;
        try_files $uri $uri/ /shot-grid/index.html;
    }

    location /api/ {
        proxy_pass http://ruoyi-backend:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
