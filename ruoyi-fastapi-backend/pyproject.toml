[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyi-fastapi-backend-cli"
version = "1.10.0"
description = "RuoYi FastAPI backend internal CLI entrypoint"
requires-python = ">=3.10"

[project.optional-dependencies]
development = [
    "ruff==0.16.1",
]
postgresql = [
    "asyncpg==0.31.0",
    "psycopg2==2.9.12",
]
test-postgresql = [
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "psycopg2==2.9.12",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
ruoyi = "cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "postgresql_integration: 需要通过 SHOT_GRID_TEST_POSTGRES_URL 连接真实 PostgreSQL",
]

[tool.setuptools.packages.find]
include = ["cli*"]
